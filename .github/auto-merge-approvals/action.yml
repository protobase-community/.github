# Merges the pull requests a workflow event is about once CodeRabbit, or anyone with write access, approved the head
# after the auto-merge-approvals label was added and every other check on the head passed (decision.ts holds the
# rules). The reusable workflow .github/workflows/auto-merge-approvals.yml runs it; it is an action rather than a step of
# that workflow so the runner fetches these scripts from this repository, while a called workflow's checkout fetches the
# caller's.
name: auto-merge-approvals
description: Merge an approved pull request with the auto-merge-approvals label once every check on its head passed.
inputs:
  token:
    description: The token the merge reads and merges with, the caller's GITHUB_TOKEN.
    required: true
  default-branch:
    description: The repository's default branch, the only base a merge starts dispatch-after-merge on.
    required: true
  dispatch-after-merge:
    description: Workflow files, space-separated, started with workflow_dispatch after a merge into the default branch.
    default: ''
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.4
    - shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        DEFAULT_BRANCH: ${{ inputs.default-branch }}
        DISPATCH_AFTER_MERGE: ${{ inputs.dispatch-after-merge }}
      run: bun "$GITHUB_ACTION_PATH/main.ts"
