# Releases development into the default branch only on the captain's go; see protobase-community/.github's release
# workflow. It must be on both branches: a push to development runs development's copy, the schedule, which notices
# the captain's approval, the default branch's.
name: release

on:
  push:
    branches: [development]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  # write opens and merges the release's pull request where the default branch takes changes only through one.
  pull-requests: write
  # write starts deploy-workflow after a merge; a caller without one grants read.
  actions: write
  checks: read
  statuses: read

jobs:
  release:
    uses: protobase-community/.github/.github/workflows/release.yml@main # zizmor: ignore[unpinned-uses] main is the reviewed version
    # A private repository runs on the organization's own runners; a repository with a version tags its releases with
    # it, and one that ships on a tag starts its release workflow there:
    # with:
    #   runs-on: hetzner-private
    #   version-file: packages/manager/package.json
    #   deploy-workflow: release.yml
    #   deploy-ref: tag
    secrets:
      BACKLOG_RELEASE_EMAIL: ${{ secrets.BACKLOG_RELEASE_EMAIL }}
      BACKLOG_RELEASE_PASSWORD: ${{ secrets.BACKLOG_RELEASE_PASSWORD }}
