# AI review of every pull request; see protobase-community/.github's ai-pr-review workflow. A review that finds no
# issues also merges the pull request, once every other check passed, unless it carries the do-not-merge label.
# pull_request_target runs this file from the base branch and never checks out the pull request.
# Each merge sends the pull_request_merged repository_dispatch, since a push made with GITHUB_TOKEN starts no workflow:
# a workflow that runs on merges, such as a release, lists `repository_dispatch: types: [pull_request_merged]` under
# `on:` and reads github.event.client_payload.number (the pull request), .base (the branch it merged into) and .sha
# (the merge commit). It runs from the default branch, so one that releases only one branch checks base.
name: ai-review

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] nothing from the pull request runs
    # The review adds ai-approved with GITHUB_TOKEN, and a label added with GITHUB_TOKEN starts no workflow.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  # The repository's CI workflows, by name: each run that finishes tries the merge again. Never list ai-review itself.
  workflow_run:
    workflows: [ci]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr-number:
        description: The pull request to review.
        required: true
        type: number

# Merging a pull request takes contents: write: https://docs.github.com/en/rest/authentication/permissions-required-for-github-apps#repository-permissions-for-contents
# dispatch-after-merge, to start a workflow such as a release on the base branch after a merge, needs actions: write.
permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write
  statuses: read

jobs:
  review:
    uses: protobase-community/.github/.github/workflows/ai-pr-review.yml@main # zizmor: ignore[unpinned-uses] main is the reviewed version
    with:
      auto-merge: true
      pr-number: ${{ inputs.pr-number || 0 }}
      # dispatch-after-merge: release.yml
    secrets:
      SCW_PR_REVIEW_SECRET_KEY: ${{ secrets.SCW_PR_REVIEW_SECRET_KEY }}
