# Keeps this repository's files that the AI review bots read within their limits; see prompt-length.yml.
# review.md and framework-generic.md are read by Qwen and, as guideline files, by CodeRabbit; framework-generic.md
# and CONTRIBUTING.md are also pasted into cubic custom agents, which keep only their first 10,000 characters.
# answer.md and rules.md only Qwen reads, and its review has no such limit.
name: prompt-length-check

on:
  pull_request:

permissions:
  contents: read

jobs:
  prompt-length:
    uses: ./.github/workflows/prompt-length.yml
    with:
      files: |
        .github/ai-review/prompts/review.md 10000
        .github/ai-review/prompts/framework-generic.md 10000
        CONTRIBUTING.md 10000
