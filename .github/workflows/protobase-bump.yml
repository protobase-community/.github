# Moves a template to the latest Protobase release in a pull request, which the AI review merges once it finds no
# issues and the template's CI passes.
#
# Every @protobase/* package gets the same specifier, the release's caret range (^<version>), and bun.lock follows. The change goes to one branch,
# protobase-bump, so a template never has more than one bump pull request: a newer release replaces the branch
# and the open pull request with it. Each run rebuilds the branch from the default branch, so a fix landed there
# after the bump opened reaches the pull request and gets a new CI run. A pull request whose CI fails, or whose review finds an issue, stays open for a person.
#
# Pushes made with the default GITHUB_TOKEN start no pull_request runs, so this workflow starts the template's CI
# and its AI review (ai-pr-review.yml, with auto-merge on) with workflow_dispatch, once for each head commit. The
# review merges the pull request. The template needs "Allow GitHub Actions to create and approve pull requests"
# on, so GITHUB_TOKEN may open one.
name: protobase-bump

on:
  workflow_call:
    inputs:
      version:
        description: The Protobase release to move to; the latest on npm when empty.
        type: string
        default: ""
      ci-workflow:
        description: The template's CI workflow file, which must accept workflow_dispatch.
        type: string
        default: ci.yml
      review-workflow:
        description: The template's AI review caller, which must accept workflow_dispatch with a pr-number input.
        type: string
        default: ai-review.yml
      bun-version:
        description: The Bun that writes bun.lock; keep it the same as the template's CI.
        type: string
        default: 1.4.2

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      actions: write
    concurrency:
      group: protobase-bump-${{ github.repository }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: protobase-bump
    steps:
      - uses: actions/checkout@v4
        with:
          path: template
      - uses: actions/checkout@v4
        with:
          repository: protobase-community/.github
          ref: main
          path: tool
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}

      - working-directory: tool/.github/protobase-bump
        run: bun install --frozen-lockfile

      - id: bump
        working-directory: template
        env:
          VERSION: ${{ inputs.version }}
        run: bun ../tool/.github/protobase-bump/bump.ts . "$VERSION" >> "$GITHUB_OUTPUT"

      - if: steps.bump.outputs.changed == 'true'
        working-directory: template
        env:
          CURRENT: ${{ steps.bump.outputs.current }}
          TARGET: ${{ steps.bump.outputs.target }}
        run: |
          bun install

          git checkout -B "$BRANCH"
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "chore: protobase $TARGET"

          # The branch is rebuilt from the default branch on every run, so a fix landed there after the bump opened
          # reaches it. Only a branch with the same tree is left alone, so its commit keeps its CI and review runs.
          if git fetch --quiet --depth 1 origin "$BRANCH" 2>/dev/null && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'FETCH_HEAD^{tree}')" ]; then
            echo "The $BRANCH branch already moves the current template to $TARGET."
            exit 0
          fi
          git push --force origin "$BRANCH"

          title="chore: protobase $TARGET"
          body="Moves the @protobase/* packages from $CURRENT to $TARGET. What changed: https://github.com/PrototeamHQ/protobase/releases

          This pull request merges itself once its AI review finds no issues and CI passes. Otherwise it stays open for a person, until a newer release replaces it."
          number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body "$body"
          else
            gh pr create --head "$BRANCH" --title "$title" --body "$body"
          fi

      - name: Start CI and the AI review on the open bump pull request
        env:
          CI_WORKFLOW: ${{ inputs.ci-workflow }}
          REVIEW_WORKFLOW: ${{ inputs.review-workflow }}
        run: |
          read -r number sha <<< "$(gh pr list --head "$BRANCH" --state open --json number,headRefOid --jq '.[0] // empty | "\(.number) \(.headRefOid)"')"
          if [ -z "$number" ]; then
            echo "No open bump pull request."
            exit 0
          fi

          # Only a dispatched CI run counts: the pull_request runs of a GITHUB_TOKEN push wait for an approval and never run.
          ci_run=$(gh run list --workflow "$CI_WORKFLOW" --commit "$sha" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$ci_run" ]; then
            gh workflow run "$CI_WORKFLOW" --ref "$BRANCH"
          fi

          # The review runs on the default branch, so it is found by its comment, which names the commit it reviewed.
          if ! gh api "repos/$GH_REPO/issues/$number/comments" --paginate --jq '.[] | select(.user.login == "github-actions[bot]") | .body' | grep -q "<!-- reviewed $sha "; then
            gh workflow run "$REVIEW_WORKFLOW" -f pr-number="$number"
          fi
