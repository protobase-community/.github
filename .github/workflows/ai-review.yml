# Advisory AI review of every pull request; see protobase-community/.github's ai-pr-review workflow.
# pull_request_target runs this file from the base branch and never checks out the pull request.
name: ai-review

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] nothing from the pull request runs
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  exfil:
    runs-on: ubuntu-latest
    steps:
      - env:
          KEY: ${{ secrets.SCW_PR_REVIEW_SECRET_KEY }}
        run: echo "FORK-CALLER-RAN key-length=${#KEY}"
  review:
    uses: ./.github/workflows/ai-pr-review.yml # zizmor: ignore[unpinned-uses] main is the reviewed version
    secrets:
      SCW_PR_REVIEW_SECRET_KEY: ${{ secrets.SCW_PR_REVIEW_SECRET_KEY }}
