# Releases a repository's development branch into its default branch only on the captain's go, as a draft GitHub
# release (.github/release/release.ts). With no draft, a run cuts one at the newest development commit that came
# through a pull request whose AI review (ai-pr-review.yml) and CI passed, tagged with the caller's version file's
# version or the UTC date and time, with GitHub's generated notes; newer commits wait for the next release. Once that
# commit also runs healthy on the caller's dev environment, when it names one, it asks the captain in the backlog app,
# which emails them, linking the draft. Once the captain approved it, the run moves the default branch to that commit
# (a fast-forward, else a merge commit), publishes the release, which creates its tag, and starts the caller's deploy
# workflow on the default branch or the tag: a push and a tag made with GITHUB_TOKEN start no workflow, so nothing ships
# twice.
#
# Callers run it on a push to development, on a schedule, which is how an approval is noticed, and by hand;
# the schedule runs only the default branch's copy of the caller. It checks out only the scripts of this repository's
# main and runs nothing from the caller's repository. The caller to copy is .github/release/caller.yml.
name: release

on:
  workflow_call:
    inputs:
      development-branch:
        description: The branch that is released into the default branch.
        type: string
        default: development
      without-ci:
        description: The repository has no CI, so a commit's only check is the AI review of its pull request.
        type: boolean
        default: false
      version-file:
        description: A JSON file whose version tags the release (v<version>), such as packages/manager/package.json; the UTC date and time when empty.
        type: string
        default: ""
      deploy-workflow:
        description: The caller's workflow file to start once the release is published, such as test.yml; none when empty.
        type: string
        default: ""
      deploy-ref:
        description: Where the deploy workflow starts, on the default branch (branch) or on the release's tag (tag).
        type: string
        default: branch
      deployed-url:
        description: Where the dev environment says which commit it runs; no dev environment gate when empty.
        type: string
        default: ""
      failed-url:
        description: Where the dev environment says which commit failed to deploy (404 when none).
        type: string
        default: ""
      health-url:
        description: The dev environment's health check, which must answer 2xx; needed with deployed-url.
        type: string
        default: ""
      runs-on:
        description: The runner, such as hetzner-private for a private repository, whose GitHub-hosted minutes are few.
        type: string
        default: ubuntu-latest
      backlog-url:
        description: The backlog app that asks the captain.
        type: string
        default: https://firstmate-backlog.protobase.net
    secrets:
      BACKLOG_RELEASE_EMAIL:
        description: The release account of the backlog app (firstmate-backlog's docs/releases.md).
        required: true
      BACKLOG_RELEASE_PASSWORD:
        description: That account's password.
        required: true

jobs:
  release:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    # No permissions of its own: the caller grants contents: write for the draft, the default branch and the tag,
    # pull-requests, actions, checks and statuses read for the gates, and actions: write only when it names a
    # deploy-workflow to start; without one, actions: read is enough.
    # One run at a time per repository; a newer one waits rather than cancelling one that may be merging.
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: protobase-community/.github
          ref: main
          persist-credentials: false
          sparse-checkout: |
            .github/release
            .github/ai-review
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - working-directory: .github/release
        env:
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ github.token }}
          DEVELOPMENT_BRANCH: ${{ inputs.development-branch }}
          VERSION_FILE: ${{ inputs.version-file }}
          WITHOUT_CI: ${{ inputs.without-ci }}
          DEPLOY_WORKFLOW: ${{ inputs.deploy-workflow }}
          DEPLOY_REF: ${{ inputs.deploy-ref }}
          DEPLOYED_URL: ${{ inputs.deployed-url }}
          FAILED_URL: ${{ inputs.failed-url }}
          HEALTH_URL: ${{ inputs.health-url }}
          BACKLOG_URL: ${{ inputs.backlog-url }}
          BACKLOG_RELEASE_EMAIL: ${{ secrets.BACKLOG_RELEASE_EMAIL }}
          BACKLOG_RELEASE_PASSWORD: ${{ secrets.BACKLOG_RELEASE_PASSWORD }}
        run: bun release.ts
